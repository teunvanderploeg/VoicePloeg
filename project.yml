name: VoicePloeg
options:
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
targets:
  VoicePloeg:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
      - path: Core
      - path: UI
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voiceploeg.app
        PRODUCT_NAME: VoicePloeg
        INFOPLIST_FILE: App/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/VoicePloeg.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.voiceploeg.app.debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.voiceploeg.app
    scheme:
      testTargets: []
    postBuildScripts:
      - name: Bundle Whisper Runtime
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 "$SRCROOT/Scripts/bundle_whisper.py" \
            "$SRCROOT/Vendor/whisper.cpp/build" \
            "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/Whisper.app"
      - name: Sign Crisper Runtime Installer
        basedOnDependencyAnalysis: false
        script: |
          if [[ "${CODE_SIGNING_ALLOWED:-YES}" == "NO" || -z "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]]; then
            exit 0
          fi
          for candidate in \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/uv" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/CrisperWorker/uv"; do
            if [[ -x "$candidate" ]]; then
              /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime "$candidate"
            fi
          done
